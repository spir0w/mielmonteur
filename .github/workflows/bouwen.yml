name: Bouwen

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scripts controleren
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Importeren in de browser (ISO, ZIP, map)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso zip
          node --test tests/importeren.test.mjs
      - name: Starter (PowerShell)
        shell: pwsh
        run: ./tests/start-miel.tests.ps1
      - name: Webpagina in Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          node --test tests/webpagina.test.mjs

  windows:
    name: Windows-versie
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Gereedschap installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 pkg-config

      - name: Bibliotheken uit de cache
        uses: actions/cache@v4
        with:
          path: |
            build/mingw-deps
            build/mingw-deps-src
          key: mingw-deps-${{ hashFiles('scripts/build-mingw-deps.sh') }}

      - name: Bouwen
        run: scripts/build-windows.sh dist/windows/MielMonteur

      # GitHub pakt het artifact zelf in: één ZIP met de map MielMonteur erin.
      - uses: actions/upload-artifact@v4
        with:
          name: MielMonteur-Windows
          path: dist/windows
          if-no-files-found: error

  windows-test:
    name: Windows-versie testen op Windows
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MielMonteur-Windows
          path: test-pakket
      - name: Herkent scummvm.exe Miel Monteur? (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\windows-pakket.tests.ps1 -Pakket test-pakket\MielMonteur

  web:
    name: Browserversie
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Emscripten uit de cache
        uses: actions/cache@v4
        with:
          path: build/emsdk-4.0.10
          key: emsdk-4.0.10-v1

      - name: Bouwen
        run: scripts/build-web.sh dist/web

      - uses: actions/upload-artifact@v4
        with:
          name: MielMonteur-Web
          path: dist/web
          if-no-files-found: error

  web-test:
    name: Browserversie testen in Chromium
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: MielMonteur-Web
          path: site
      - name: Herkent de echte ScummVM in de browser Miel Monteur?
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          MIEL_WEB_SITE=site MIEL_SCHERMAFDRUK=webversie.png node --test tests/webversie.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webversie-schermafdruk
          path: webversie.png
          if-no-files-found: ignore

  # Een versie uitbrengen: maak een tag die met v begint (bijvoorbeeld v1.0).
  release:
    name: Uitgave
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-test, web-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Inpakken
        run: |
          (cd artifacts/MielMonteur-Windows && zip -q -r -9 ../../MielMonteur-Windows.zip MielMonteur)
          (cd artifacts/MielMonteur-Web && zip -q -r -9 ../../MielMonteur-Web.zip .)
      - name: Uitgave maken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Miel Monteur $GITHUB_REF_NAME" \
            --notes "Zie de README voor uitleg. Het spel zelf zit er niet bij: gebruik je eigen cd-rom, ISO of download." \
            MielMonteur-Windows.zip MielMonteur-Web.zip

  # De browserversie op GitHub Pages zetten, vanaf de standaardbranch. Zet
  # hiervoor in de repository Settings > Pages > Source op "GitHub Actions";
  # staat Pages uit, dan slaat deze stap zichzelf over.
  pages:
    name: GitHub Pages
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: web-test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Staat Pages aan?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type > build_type.txt 2>/dev/null && grep -q workflow build_type.txt; then
            echo "aan=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages staat niet aan (of niet op 'GitHub Actions'): de browserversie is niet gepubliceerd."
            echo "aan=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pages.outputs.aan == 'true'
        uses: actions/download-artifact@v4
        with:
          name: MielMonteur-Web
          path: site
      - if: steps.pages.outputs.aan == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.pages.outputs.aan == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
